name: Keep demo awake

on:
  schedule:
    - cron: "*/10 7-20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the live demo
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --max-time 120 https://erion-gymflow.onrender.com/health
